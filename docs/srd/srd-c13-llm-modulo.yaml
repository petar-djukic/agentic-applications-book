modification:
  change: "raise the retry limit from two to five in check_retry_limit's config"
  run: "the planner demo on a task that fails vet"
  expect: "more retries, same terminal honesty -- the bound moves, the soundness does not"
  because: "the critics gate the exit; the budget only prices persistence"
verdict_type: holds
create_pointer: "add a fourth sound critic -- a license-header check -- naming the exec declaration and the machine edge between test and done"
