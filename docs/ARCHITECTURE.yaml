# Where chapter material comes from. Chapters consume the series drafts
# and the examples; each SRD names its own prior material.
material_sources:
  - path: examples/
    offers: "the runnable machines, canned demos, and the listings the audit extracts"
    feeds: "every paper chapter"
  - path: "substack/series/implement-a-paper.md and its brainstorm stubs"
    offers: "the 15-piece series arc the chapters consolidate from as they stabilize"
    feeds: "every paper chapter"
  - path: "declarative-agents (upstream and fork)"
    offers: "the runtime, the catalog families examples copy at pinned releases, and the Create-tier landing ground"
    feeds: "P1, every paper chapter"
  - path: docs/adopted/instrumentation/
    offers: "seven drafting contracts retired from Build a Coding Agent, held verbatim with their caveats"
    feeds: "deferred -- see decisions"

decisions:
  - id: D1
    decision: "Chapter ids are stable slugs, never positions."
    reason: |
      examples/MANIFEST.yaml, the road-map, and the SRDs all bind to
      chapter ids, and the book renumbers files as parts grow. Freezing
      the id at assignment makes a renumber a file rename, not a
      cross-repository edit. Settles GH-27's convention question; C-rlm
      is the precedent.
  - id: D2
    decision: "The RLM chapter joins Part III as C-rlm, before the closer."
    reason: |
      The series arc places implement-recursive-lms as piece 14 in the
      Create tier, and its example already runs (GH-20). The chapter
      file arrives with its draft; the id exists now so the example's
      manifest binding resolves.
  - id: D3
    decision: "Instrumentation placement is deferred, not decided."
    reason: |
      The adopted contracts (GH-13) own material this book has committed
      to teach, but whether it becomes a part of its own or is woven
      through the rebuild chapters depends on the constitutions and the
      road-map (GH-8, GH-9), which do not exist yet. Deciding structure
      against absent documents is how work gets redone; the holdings
      README carries the adaptation obligations either way.

traceability:
  - "VISION goals -> this file: G1 and G5 bind through chapter_form (the six sections and the verdicts); G2 through examples/ and the run-gate; G3 through the exercise section; G4 through the create pointer."
  - "This roster -> examples: every chapter: id in examples/MANIFEST.yaml resolves against structure.parts (enforced by the examples audit the moment this file exists)."
  - "This roster -> SRDs: each chapter names its srd: path; GH-10 creates the files and the audit's realizes binding flips to enforced when docs/srd/ lands."

workflow: |
  Spec-first, series-first: chapters run as Implement-a-Paper pieces at
  Mesh Intelligence and consolidate here as they stabilize. SRDs (GH-10)
  precede chapter drafts; the road-map (GH-8) orders the drafting and
  gates Create-tier chapters on the declarative-agents work landing
  first. The process constitution (GH-9) governs revision from the first
  full draft onward.
