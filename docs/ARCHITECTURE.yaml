# ARCHITECTURE.yaml -- how the book is put together (GH-7, under EPIC
# GH-6). Components, the chapter roster with its stable ids, the
# per-chapter contract, and traceability. Chapter-level obligations
# arrive with the SRDs (GH-10) and bind against this roster.

meta:
  name: agentic-applications
  governs: "repository root"
  version: 1

components:
  steering:
    path: docs/
    role: "VISION.yaml (goals) and this file; road-map.yaml and definitions.yaml (GH-8); constitutions/ (GH-9); srd/ with one drafting contract per chapter (GH-10)."
  chapters:
    path: "NN-slug.md (repository root)"
    role: "Markdown is the canonical source, compiled by mage pdf through the Eisvogel pandoc template. File numbers order the reading; the stable chapter ids below are the identity every other document binds to, so renumbering files never breaks a reference."
  examples:
    path: examples/
    role: "The book's runnable artifacts, governed by their own contract (examples/docs/). Listings in drafted chapters are extracted regions of example source, byte-compared by the audit; chapter ids used in examples/MANIFEST.yaml resolve against the roster in this file."
  figures:
    path: figures/
    role: "PlantUML sources; mage figures renders PNGs. No committed render artifacts."
  build:
    path: magefiles/
    role: "mage all: figures then pdf into generated-files/. mage audit: the examples module checks, then listing extraction. mage outline: the review outline from docs/srd/. mage critic: drafted chapters against the constitutions and SRDs."
  adopted:
    path: docs/adopted/
    role: "Holdings received from other repositories, verbatim with provenance, awaiting adaptation under this book's own framework. Currently the instrumentation contracts from Build a Coding Agent (GH-13)."

# The per-chapter contract. Defined in the Implement-a-Paper constitution
# (ported to docs/constitutions/voice.yaml by GH-9); named here because
# every paper chapter's SRD is an instance of it, never restated here.
chapter_form:
  source: "docs/constitutions/voice.yaml (GH-9), porting substack/.claude/constitutions/articles/implement-a-paper.md"
  shape: |
    One message per chapter, about the paper's mechanism meeting the
    machine's constraints. After the opening, the retest box: the paper's
    claim restated falsifiably, the interval since publication, and the
    promise to run it. Then the six sections: the paper's claim; the
    mapping (concept-to-construct table with the load-bearing YAML on the
    page, under ~40 lines); the forced decisions and what aged; the
    exercise (one modification, predicted observable outcome); the create
    pointer (present in every chapter); the takeaway question. The
    run-gate is a publish gate: the demo must run from a fresh clone at a
    named release before a chapter ships, and Create-tier chapters land
    their code in declarative-agents first.
  boundary: |
    Every rebuild is a conceptual replication, not a reproduction. No
    chapter claims to have rerun a paper's benchmarks unless it did, and
    claims track the example manifests' status vocabulary: nothing
    partial or planned is described as running.

# The chapter roster. Ids are stable slugs frozen at assignment, not
# positions: C<n> records the file number each chapter had when its id
# was assigned, and the id never changes afterwards -- a chapter keeps
# its id through any renumbering, and a new chapter takes a new id
# rather than shifting its neighbours' (the convention question raised
# in GH-27, settled here). C-rlm predates this file with a
# non-positional id and keeps it. Front matter (00, 01, part openers,
# references) carries no id; nothing binds to it.
structure:
  parts:
    - id: P1
      title: "Part I -- The Substrate"
      opener: 02-part-i-the-substrate.md
      chapters:
        - id: C3
          title: "You Can't Edit the Model"
          file: 03-you-cant-edit-the-model.md
          srd: docs/srd/srd-c3-you-cant-edit-the-model.yaml
        - id: C4
          title: "Every Agent Needs an Undo"
          file: 04-every-agent-needs-an-undo.md
          srd: docs/srd/srd-c4-every-agent-needs-an-undo.yaml
        - id: C5
          title: "How to Give an Agent an API"
          file: 05-give-an-agent-an-api.md
          srd: docs/srd/srd-c5-give-an-agent-an-api.yaml
        - id: C6
