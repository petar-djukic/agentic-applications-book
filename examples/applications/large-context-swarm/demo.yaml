#
# The canned demo. Every step runs offline against the module cache and
# needs no credentials, per the ARCHITECTURE canned-demos constraint.
#
# Three steps. The two validate steps run the runtime's own preflight
# against each profile. The third runs the blackboard loop end to end
# against loopback stubs replaying testdata/responses/, and asserts the
# six properties of srd-large-context-swarm D3 against the stubs'
# request log -- exiting non-zero if any fails.
#
# The loop step binds its stubs to ephemeral loopback ports and runs
# the machines from a staged, address-patched copy of the profile tree
# (#38). The copied corpus-rest.yaml on disk stays byte-identical; a
# real Ollama or Chroma can keep its ports.
steps:
  - name: validate rlm-worker
    argv:
      - go
      - run
      - github.com/Nokia-Bell-Labs/declarative-agents/agent-core/cmd/agent
      - --validate-config
      - --profile
      - agents/rlm-worker/profile.yaml
  - name: validate rlm-root
    argv:
      - go
      - run
      - github.com/Nokia-Bell-Labs/declarative-agents/agent-core/cmd/agent
      - --validate-config
      - --profile
      - agents/rlm-root/profile.yaml
  - name: run the blackboard loop and assert
    argv:
      - go
      - run
      - ./cmd/swarmdemo
