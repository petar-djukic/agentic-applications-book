#
# The query prefix. The three write words the machine ends with are the
# catalog memory-write block's and are selected in tools.yaml, not
# redeclared here (srd-large-context-swarm C10).
tools:
  - name: embed_intent
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Embed the intent at Ollama and carry the collection and the three query filters forward.
    problem: Chroma does not embed server-side, so the vector query needs its vector computed at a provider.
    goals:
      - Select the intent text, collection, and filters from the request seed.
      - Return the embedding vector mapped from the Ollama response.
      - Carry the collection and filters forward for the resolve and query words.
    requirements:
      input:
        - Runtime input is selected from the request seed through input_mapping.
      output:
        - Output includes the mapped embedding vector and the carried query fields.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not author or alter the embedding vector.
      - Does not author the filters; they arrive as trusted request input.
    parameters:
      type: object
      properties:
        content: {type: string}
        collection: {type: string}
        where: {type: object}
        where_document: {type: object}
        n_results: {type: integer}
    emits: [QueryEmbedded, CommandError]
    output:
      description: Mapped Ollama embedding with the carried query fields.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: ollama.embeddings
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Computing an embedding does not mutate state.
    errors:
      - signal: CommandError
        condition: The Ollama embeddings call fails on network, timeout, schema, or mapping.
        state_after_failure: No embedding is produced and no state changes.
    relationships:
      overlaps:
        - tool: embed_memory
          difference: embed_memory embeds a finding for storage; this word embeds an intent for retrieval and carries filters rather than provenance.
      before: [resolve_query_collection]
    config:
      rest_ref: ollama
      operation: embed_memory_query

  - name: resolve_query_collection
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Create-or-get the per-task collection and carry the query vector and filters forward.
    problem: Single-hop threading means the resolved collection id must reach the query through this word.
    goals:
      - Create-or-get the collection the request named.
      - Resolve the returned collection id for the query path.
      - Carry the query embedding and the three filters forward from the embed Result.
    requirements:
      input:
        - The collection name, query embedding, and filters are selected from the previous embed Result output.
      output:
        - Output includes the mapped collection id and the carried query fields.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not configure a server-side embedding function.
      - Does not create the collection's contents; ingest owns that.
    parameters:
      type: object
      properties:
        collection_name: {type: string}
        query_embeddings: {type: array}
        where: {type: object}
        where_document: {type: object}
        n_results: {type: integer}
    emits: [CollectionReady, CommandError]
    output:
      description: Mapped Chroma collection id with the carried query fields.
      schema:
        type: object
        properties:
          mapped: {type: object}
          carried: {type: object}
    side_effects:
      - kind: external_api
        target: chroma.collection
        state: read_only
        description: Create-or-get is idempotent for a stable collection name, so
          the call leaves no net change to reverse.
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: Create-or-get is idempotent for a stable collection name.
    errors:
      - signal: CommandError
        condition: The Chroma create-or-get collection call fails on network, timeout, schema, or mapping.
        state_after_failure: The collection id is unresolved; create-or-get is idempotent so there is no net change.
    relationships:
      overlaps:
        - tool: resolve_memory_collection
          difference: That word carries a record and its provenance toward a write; this one carries a query vector and its filters toward a read.
      after: [embed_intent]
      before: [search_blackboard]
    config:
      rest_ref: chroma
      operation: create_or_get_collection_named_query

  - name: search_blackboard
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Query the resolved collection with all three filter modes at once.
    problem: |
      An intent has to be answerable from a corpus no agent reads whole.
      Similarity alone returns neighbours of the wrong kind, and a
      metadata filter alone cannot find a literal identifier. The
      blackboard's filtered query takes vector, exact substring, and
      metadata together, which is what makes one intent a bounded read
      rather than a scan.
    goals:
      - Thread the collection id, query embedding, and filters from the previous Result.
      - Return the matching ids, documents, and metadatas.
    requirements:
      input:
        - Collection id, query embedding, and the three filters are selected from the previous Result output.
      output:
        - Output reports the matching record ids, their documents, and their metadata.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not write to the collection.
      - Does not rank or filter the returned set further; the query is the filter.
    parameters:
      type: object
      properties:
        collection: {type: string}
        query_embeddings: {type: array}
        where: {type: object}
        where_document: {type: object}
        n_results: {type: integer}
    emits: [QueryResponded, CommandError]
    output:
      # The worker is the half of the swarm permitted to see documents.
      # The root's equivalent word maps ids and metadatas only; see
      # srd-large-context-swarm I1.
      description: Matching record ids, documents, and metadata.
      schema:
        type: object
        properties:
          ids: {type: array}
          documents: {type: array}
          metadatas: {type: array}
    side_effects:
      - kind: external_api
        target: chroma.query
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A query does not mutate the collection.
    errors:
      - signal: CommandError
        condition: The Chroma query call fails on network, timeout, schema, or mapping.
        state_after_failure: No result set is produced and the collection is unchanged.
    relationships:
      after: [resolve_query_collection]
      before: [compose_finding]
    config:
      rest_ref: chroma
      operation: query_records_filtered
