name: rlm-worker
purpose: |-
  One intent in, one provenance-tagged finding on the blackboard, then
  exit. The worker embeds its intent, resolves the per-task collection,
  runs a filtered query against it, reads the returned chunks into a
  finding, and writes that finding back tagged with source, agent, and
  round.

  This is the half of the swarm that is allowed to see corpus text. The
  root is not: it collects what workers wrote by metadata alone. A
  worker therefore reads freely and returns nothing to its caller except
  the record id of what it stored, which is what keeps the corpus out of
  the root's context window.

  The caller supplies the intent through the --request file, whose
  bytes become the initial Seed Result.Output (runtime contract). The
  machine's first word republishes the fields under the label `request`
  so the write path can reach them after the model call; the query path
  reads them as its previous Result. The filters arrive as trusted
  request input rather than as model-authored text, and the model is
  asked for one thing only: the finding.
realizes:
  # srd-large-context-swarm, examples/docs/srd/
  - C6   # this file set and this state shape
  - C7   # all three query modes, in Searching
  - C8   # exactly one finding, tagged, in Writing
  - C9   # termination is process exit
  - C10  # catalog blocks referenced, not copied
  - I4   # provenance complete on the written entry
invariants:
  - REST authority lives in the catalog knowledge-manager's corpus-rest.yaml.
  - MachineSpec owns sequencing; no word chooses the next word.
  - The query carries all three filter modes -- vector, $contains, and metadata (C7).
  - Exactly one finding is written per intent; Writing has one success edge (C8).
  - The written entry carries source, agent, and round (I4).
  - No embedding vector is authored by a model; vectors thread between words.
  - The terminal Result carries the record id, never the finding text.
  - Chroma and Ollama are external preconditions, checked by the caller.
initial_state: Idle
summary_signal: MemoryAdded
budget:
  # Strictly above compose_finding's max_time of 300s: the runtime's
  # timeout-closure validation requires every operation duration below
  # the machine's command_timeout.
  command_timeout: 6m
  # Seven words, no loop. The ceiling leaves room for one retry of a
  # transient boundary failure without permitting a second pass.
  max_iterations: 12
states:
  - name: Idle
    meaning: Initial state before the intent arrives.
  - name: CapturingRequest
    meaning: The request seed is being republished as an addressable command-state value.
  - name: EmbeddingQuery
    meaning: The intent text is being embedded at Ollama for the vector query.
  - name: ResolvingQueryCollection
    meaning: The per-task collection is being create-or-got and the query carried forward.
  - name: Searching
    meaning: The filtered query is running -- vector similarity, $contains, and the metadata filter together.
  - name: Reading
    meaning: The returned chunks are being read into one finding.
  - name: ComposingRecord
    meaning: The finding is being shaped into the tagged record for the write path.
  - name: EmbeddingFinding
    meaning: The finding is being embedded at Ollama for storage.
  - name: ResolvingWriteCollection
    meaning: The same collection is being create-or-got and the tagged record carried forward.
  - name: Writing
    meaning: The tagged finding is being written to the resolved collection.
  - name: Succeeded
    meaning: Terminal. The finding is stored and its record id is the run output.
    run_status: succeeded
  - name: Failed
    meaning: Terminal. A boundary word or the model call failed.
    run_status: failed
terminal_states:
  - Succeeded
  - Failed
signals:
  - name: Seed
    trigger: Loop initialization with the request intent.
  - name: RequestCaptured
    trigger: The request fields were republished to command state.
  - name: QueryEmbedded
    trigger: Ollama returned an embedding vector for the intent.
  - name: CollectionReady
    trigger: The named collection was create-or-got and its id resolved.
  - name: QueryResponded
    trigger: Chroma returned the filtered result set.
  - name: LLMResponded
    trigger: The model returned the finding text.
  - name: RecordComposed
    trigger: The finding was shaped into the tagged record.
  - name: MemoryEmbedded
    trigger: Ollama returned an embedding vector for the finding.
  - name: MemoryAdded
    trigger: Chroma stored the tagged record.
  - name: CommandError
    trigger: Runtime, REST, or model boundary infrastructure failed.
transitions:
  # capture_request must be the first action: only the first word's
  # previous Result is the request seed (runtime contract, --request).
  # Its output repeats every seed field, so embed_intent still reads its
  # params from the previous Result unchanged.
  - state: Idle
    signal: Seed
    next: CapturingRequest
    action: capture_request
    label: request

  - state: CapturingRequest
    signal: RequestCaptured
    next: EmbeddingQuery
    action: embed_intent
  - state: CapturingRequest
    signal: CommandError
    next: Failed

  - state: EmbeddingQuery
    signal: QueryEmbedded
    next: ResolvingQueryCollection
    action: resolve_query_collection
  - state: EmbeddingQuery
    signal: CommandError
    next: Failed

  - state: ResolvingQueryCollection
    signal: CollectionReady
    next: Searching
    action: search_blackboard
  - state: ResolvingQueryCollection
    signal: CommandError
    next: Failed

  - state: Searching
    signal: QueryResponded
    next: Reading
    action: compose_finding
  - state: Searching
    signal: CommandError
    next: Failed

  # One edge out of Reading, so one intent yields one finding (C8).
  # The finding is raw model text and embed_memory selects declared
  # params from its previous Result, so a compose shapes the record
  # first, with every field except the content from the trusted request.
  - state: Reading
    signal: LLMResponded
    next: ComposingRecord
    action: compose_record
  - state: Reading
    signal: CommandError
    next: Failed

  - state: ComposingRecord
    signal: RecordComposed
    next: EmbeddingFinding
    action: embed_memory
  - state: ComposingRecord
    signal: CommandError
    next: Failed

  - state: EmbeddingFinding
    signal: MemoryEmbedded
    next: ResolvingWriteCollection
    action: resolve_memory_collection
  - state: EmbeddingFinding
    signal: CommandError
    next: Failed

  - state: ResolvingWriteCollection
    signal: CollectionReady
    next: Writing
    action: write_memory
  - state: ResolvingWriteCollection
    signal: CommandError
    next: Failed

  - state: Writing
    signal: MemoryAdded
    next: Succeeded
  - state: Writing
    signal: CommandError
    next: Failed
