#
# Index of the book's runnable examples. The audit validates this file:
# every entry pins the single runtime release below, chapter ids resolve
# into docs/ARCHITECTURE.yaml once it exists, and catalog-family entries
# carry a complete provenance block.
#
# Entry shape:
#   - id: stateflow                # directory name under applications/ or catalog/agents/
#     chapter: C11                 # stable chapter id from docs/ARCHITECTURE.yaml
#     kind: chapter-application    # chapter-application | catalog-family
#     status: planned              # planned | partial | implemented
#     srd: docs/srd/srd-stateflow.yaml
#     listings: [c11-1, c11-2]     # listing ids the chapter extracts from this example
#     provenance:                  # catalog-family entries only
#       upstream: Nokia-Bell-Labs/declarative-agents
#       path: applications/catalog/agents/executor
#       release: v0.20260814.4
#       simplified: "what was dropped relative to upstream"
schema_version: 1
# Two coordinates, because they are two different things and the first
# demo to need a buildable dependency found them conflated.
#
# module/release name the declarative-agents *repository* release that
# catalog copies are taken at. Every catalog-family provenance block
# pins this exact string; that is the one-release closure of VISION G4
# on copied material.
#
# go_module/go_version name the *Go module* examples build against.
# There is no module at the repository root -- the runtime is the nested
# agent-core module, and nested modules carry prefixed tags. Nokia
# publishes no agent-core tag at the release above, so the pin is the
# pseudo-version the Go proxy mints for the nearest commit whose
# agent-core tree is identical to the v0.20260814.4 tag's (verified:
# no agent-core commits lie between them). The date stamp in it is the
# proxy's, not a second release.
runtime:
  module: github.com/Nokia-Bell-Labs/declarative-agents
  release: v0.20260814.4
  go_module: github.com/Nokia-Bell-Labs/declarative-agents/agent-core
  go_version: v0.20260803.1-0.20260815014700-f3e1f68d379c
examples:
  # C-rlm is the chapter's stable id, assigned in docs/ARCHITECTURE.yaml
  # (Part III; ids are frozen slugs, never positions -- its D1).
  - id: large-context-swarm
    chapter: C-rlm
    kind: chapter-application
    status: implemented
    srd: docs/srd/srd-large-context-swarm.yaml
  # The blackboard blocks the swarm composes. release: is the pinned
  # declarative-agents release, which is the newest upstream tag the
  # fork's main contains -- so the copy is upstream v0.20260814.4 plus
  # the fork's additive extension, and simplified: says which is which.
  - id: knowledge-manager
    chapter: C-rlm
    kind: catalog-family
    status: implemented
    srd: docs/srd/srd-knowledge-manager.yaml
    provenance:
      upstream: petar-djukic/declarative-agents
      path: applications/catalog/agents/knowledge-manager
      release: v0.20260814.4
      simplified: >-
        Copied at fork commit c87a5322, whose newest upstream tag is
        v0.20260814.4. Four of the family's six blocks are here:
        corpus-rest.yaml complete and the memory-write block (#26),
        plus corpus-ingest and corpus-reader byte-identical (#40, read
        by the compatibility test; the swarm composes none of them).
        Not copied: rag-server and documentation-curator. The fork's
        conformance test and integration gate were adopted with #40
        into examples/conformance/ and integration:blackboardMemory;
        srd023 and its use case are not reproduced -- their obligations
        are restated in docs/srd/srd-knowledge-manager.yaml. The fork
        is a fork of Nokia-Bell-Labs/declarative-agents: the blocks are
        Nokia's, the extension was authored in the fork under the same
        BSD-3 header, and both are covered by it.
